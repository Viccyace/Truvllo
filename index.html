<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1B4332" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Truvllo" />
  <meta name="description"
    content="AI-powered budget tracker. Set a budget, log expenses, and get personalised insights — for free." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
    rel="stylesheet" />
  <title>Truvllo — Budget with clarity</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body,
    #root {
      min-height: 100vh;
      background: #FAF8F3;
    }

    #preloader {
      background: #0A0A0A;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    #preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0A0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* Logo */
    .pre-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .pre-logo {
      font-family: Georgia, serif;
      font-size: 48px;
      font-weight: 700;
      color: #FAF8F3;
      letter-spacing: -0.03em;
      opacity: 0;
      transform: translateY(16px);
      animation: logoIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .pre-tagline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: rgba(250, 248, 243, 0.35);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 0.4s ease 0.7s forwards;
    }

    /* Progress bar at bottom */
    .pre-progress-track {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 2px;
      background: rgba(250, 248, 243, 0.08);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.3s ease 0.5s forwards;
    }

    .pre-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1B4332, #40916C);
      border-radius: 2px;
      animation: progress 1.4s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
    }

    /* Green dot indicator */
    .pre-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #40916C;
      margin-top: 24px;
      opacity: 0;
      animation: fadeIn 0.3s ease 0.8s forwards, pulse 1.5s ease 0.8s infinite;
    }

    /* Fade out whole preloader */
    #preloader.hide {
      animation: preloaderOut 0.5s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes logoIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes progress {
      0% {
        width: 0%;
      }

      40% {
        width: 55%;
      }

      70% {
        width: 80%;
      }

      100% {
        width: 100%;
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(1.4);
      }
    }

    @keyframes preloaderOut {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
    }
  </style>
</head>

<body>

  <script>
    // Set cream background immediately — prevents dark flash on ALL visits
    document.documentElement.style.background = '#FAF8F3';
    document.body.style.background = '#FAF8F3';
  </script>

  <script>
    // Only show preloader on first visit — not on refresh
    // sessionStorage clears when tab closes but persists on refresh
    var isFirstVisit = !sessionStorage.getItem('truvllo_visited');

    if (!isFirstVisit) {
      // Refresh or navigation — skip preloader entirely
      // Set body bg to cream immediately
      document.documentElement.style.background = '#FAF8F3';
      document.body.style.background = '#FAF8F3';
    }
  </script>

  <!-- Preloader — only rendered if first visit -->
  <div id="preloader">
    <div class="pre-logo-wrap">
      <span class="pre-logo">Truvllo.</span>
      <span class="pre-tagline">Budget with clarity</span>
    </div>
    <div class="pre-dot"></div>
    <div class="pre-progress-track">
      <div class="pre-progress-bar"></div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    // Hide preloader function — called from React after mount
    window.__hidePreloader = function () {
      var el = document.getElementById('preloader');
      if (!el) return;
      // Mark as visited so next refresh skips preloader
      sessionStorage.setItem('truvllo_visited', '1');
      el.classList.add('hide');
      setTimeout(function () {
        el.remove();
        // Switch bg to cream after preloader gone
        document.documentElement.style.background = '#FAF8F3';
        document.body.style.background = '#FAF8F3';
      }, 500);
    };

    // Remove preloader immediately if not first visit
    if (!isFirstVisit) {
      var el = document.getElementById('preloader');
      if (el) el.remove();
    }
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
